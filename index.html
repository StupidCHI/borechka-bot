<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Боречка</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px;
    }
    #telegram-login {
      margin-top: 30px;
    }
    #greeting {
      margin-top: 30px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <h1>Привет, я Боречка!</h1>
  <p>Если ты не куришь, я становлюсь сильнее!</p>

  <div id="telegram-login">
    <!-- Telegram Login Widget, отображается только в браузере -->
    <script async src="https://telegram.org/js/telegram-widget.js?7"
            data-telegram-login="B0rechkabot"
            data-size="large"
            data-userpic="true"
            data-request-access="write"
            data-userpic="true"
            data-radius="10"
            data-lang="ru"
            data-onauth="onTelegramAuth(user)">
    </script>
  </div>

  <div id="greeting"></div>

  <p style="margin-top: 50px; font-size: 12px; color: gray;">v0.1 beta</p>

  <script>
    // Функция обработчика авторизации через Telegram Login Widget
    function onTelegramAuth(user) {
      document.getElementById("telegram-login").style.display = "none";
      document.getElementById("greeting").innerText = `Привет, ${user.first_name}! Рад тебя видеть.`;
    }

    // Если сайт открыт как Telegram Web App, данные пользователя доступны через Telegram.WebApp
    const isTelegram = window.Telegram && window.Telegram.WebApp;
    if (isTelegram) {
      const tg = window.Telegram.WebApp;
      tg.expand(); // развернуть Web App на весь экран
      const user = tg.initDataUnsafe.user;
      document.getElementById("telegram-login").style.display = "none";
      document.getElementById("greeting").innerText = `Привет, ${user.first_name}! Добро пожаловать в Боречку.`;
    }
  </script>

</body>
</html>
